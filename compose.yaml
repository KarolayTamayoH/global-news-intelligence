name: global-news-intelligence
services:
  mongodb:
    build:
      context: .
      dockerfile: docker/mongo/Dockerfile
    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  cassandra:
    build:
      context: .
      dockerfile: docker/cassandra/Dockerfile
    ports:
      - "127.0.0.1:${CASSANDRA_PORT:-9043}:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: global-news-intelligence
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "SELECT release_version FROM system.local;"]
      interval: 20s
      timeout: 15s
      retries: 20
      start_period: 90s

  neo4j:
    build:
      context: .
      dockerfile: docker/neo4j/Dockerfile
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7475}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7688}:7687"
    environment:
      NEO4J_AUTH: "none"
      NEO4J_dbms_security_auth__enabled: "false"
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-256m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-256m}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  airflow-db:
    image: postgres:16
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: airflow
    volumes:
      - airflow2_postgres:/var/lib/postgresql/data
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 12

  airflow:
    image: global-news-intelligence-airflow:local
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
      args:
        AIRFLOW_IMAGE: ${AIRFLOW_IMAGE:-apache/airflow:2.11.1-python3.12}
    command: ["bash", "-c", "python -m scripts.bootstrap_databases && rm -f /opt/airflow/airflow-webserver.pid && exec airflow standalone"]
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow@airflow-db/airflow"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/gni/dags
      AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: "false"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Configura AIRFLOW_ADMIN_PASSWORD en .env}
      PYTHONPATH: /opt/gni
      MONGO_URI: mongodb://mongodb:27017/
      MONGO_DATABASE: ${MONGO_DATABASE:-global_news}
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: "9042"
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-global_news_analytics}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      GNI_DATA_DIR: /opt/gni/data
      GNI_ARTIFACT_URI: file:///opt/gni/data
    volumes:
      - ./dags:/opt/gni/dags:ro
      - ./src:/opt/gni/src:ro
      - ./scripts:/opt/gni/scripts:ro
      - ./docs:/opt/gni/docs
      - ./data:/opt/gni/data
      - airflow2_home:/opt/airflow
    depends_on:
      airflow-db:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health > /dev/null"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 90s

  dashboard:
    image: global-news-intelligence-dashboard:local
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    environment:
      PYTHONPATH: /opt/gni
      MONGO_URI: mongodb://mongodb:27017/
      MONGO_DATABASE: ${MONGO_DATABASE:-global_news}
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: "9042"
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-global_news_analytics}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      GNI_DATA_DIR: /opt/gni/data
    depends_on:
      airflow:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

volumes:
  mongodb_data:
  cassandra_data:
  neo4j_data:
  airflow2_postgres:
  airflow2_home:
